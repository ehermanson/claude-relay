<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <!-- Network spokes -->
  <g stroke="#34d399" stroke-width="0.5" opacity="0.35">
    <line x1="16" y1="16" x2="16" y2="3"/>
    <line x1="16" y1="16" x2="25.2" y2="6.8"/>
    <line x1="16" y1="16" x2="29" y2="16"/>
    <line x1="16" y1="16" x2="25.2" y2="25.2"/>
    <line x1="16" y1="16" x2="16" y2="29"/>
    <line x1="16" y1="16" x2="6.8" y2="25.2"/>
    <line x1="16" y1="16" x2="3" y2="16"/>
    <line x1="16" y1="16" x2="6.8" y2="6.8"/>
  </g>
  <!-- Endpoint nodes -->
  <g fill="#34d399">
    <circle cx="16" cy="3" r="1.5"/>
    <circle cx="25.2" cy="6.8" r="1.5"/>
    <circle cx="29" cy="16" r="1.5"/>
    <circle cx="25.2" cy="25.2" r="1.5"/>
    <circle cx="16" cy="29" r="1.5"/>
    <circle cx="6.8" cy="25.2" r="1.5"/>
    <circle cx="3" cy="16" r="1.5"/>
    <circle cx="6.8" cy="6.8" r="1.5"/>
  </g>
  <!-- Core hub: concentric rings + dot -->
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="#34d399" stroke-width="0.6" opacity="0.2"/>
  <circle cx="16" cy="16" r="2.8" fill="none" stroke="#34d399" stroke-width="0.5" opacity="0.35"/>
  <circle cx="16" cy="16" r="1.4" fill="#34d399"/>
</svg>
