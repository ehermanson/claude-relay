<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <!-- Spokes: 5, irregular angles -->
  <g stroke="#34d399" stroke-width="0.8" opacity="0.35">
    <line x1="16" y1="16" x2="9" y2="4"/>
    <line x1="16" y1="16" x2="27" y2="9"/>
    <line x1="16" y1="16" x2="28" y2="22"/>
    <line x1="16" y1="16" x2="12" y2="28"/>
    <line x1="16" y1="16" x2="3" y2="18"/>
  </g>
  <!-- Endpoint nodes -->
  <g fill="#34d399">
    <circle cx="9" cy="4" r="2"/>
    <circle cx="27" cy="9" r="2"/>
    <circle cx="28" cy="22" r="2"/>
    <circle cx="12" cy="28" r="2"/>
    <circle cx="3" cy="18" r="2"/>
  </g>
  <!-- Core hub -->
  <circle cx="16" cy="16" r="3" fill="none" stroke="#34d399" stroke-width="0.7" opacity="0.2"/>
  <circle cx="16" cy="16" r="1.6" fill="#34d399"/>
</svg>
