<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <pattern id="grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M 4 0 L 0 0 0 4" fill="none" stroke="#4a8ec9" stroke-width="0.15" opacity="0.4"/>
    </pattern>
  </defs>
  <!-- Blueprint background -->
  <rect width="32" height="32" rx="7" fill="#1e3a5f"/>
  <!-- Grid overlay -->
  <rect width="32" height="32" rx="7" fill="url(#grid)"/>
  <!-- Spokes: 5, irregular angles -->
  <g stroke="#a8d4f5" stroke-width="0.8" opacity="0.4" stroke-dasharray="1.5 1">
    <line x1="16" y1="16" x2="9" y2="4"/>
    <line x1="16" y1="16" x2="27" y2="9"/>
    <line x1="16" y1="16" x2="28" y2="22"/>
    <line x1="16" y1="16" x2="12" y2="28"/>
    <line x1="16" y1="16" x2="3" y2="18"/>
  </g>
  <!-- Endpoint nodes -->
  <g fill="none" stroke="#a8d4f5" stroke-width="0.8">
    <circle cx="9" cy="4" r="2"/>
    <circle cx="27" cy="9" r="2"/>
    <circle cx="28" cy="22" r="2"/>
    <circle cx="12" cy="28" r="2"/>
    <circle cx="3" cy="18" r="2"/>
  </g>
  <!-- Core hub -->
  <circle cx="16" cy="16" r="3" fill="none" stroke="#a8d4f5" stroke-width="0.7" opacity="0.3"/>
  <circle cx="16" cy="16" r="1.6" fill="#a8d4f5"/>
</svg>
