<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Claude Relay</title>
  <!-- Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/xml.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #171717;
      --border: #262626;
      --text: #fafafa;
      --muted: #a3a3a3;
      --accent: #d4a574;
      --user-bg: #1e3a5f;
      --error: #dc2626;
      --success: #22c55e;
      --warning: #eab308;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    *::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    .messages::-webkit-scrollbar-thumb { background: transparent; }
    .messages:hover::-webkit-scrollbar-thumb { background: var(--border); }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .back-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
    }

    .back-btn:hover { color: var(--text); border-color: var(--muted); }
    .back-btn.visible { display: flex; }

    .title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.2s;
    }

    .status-dot.connected { background: var(--success); }

    .status-dot.processing {
      background: var(--warning);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout-btn {
      padding: 6px 12px;
      font-size: 13px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .logout-btn:hover { color: var(--text); border-color: var(--muted); }

    /* ===================== DASHBOARD VIEW ===================== */
    #dashboard-view {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
    }

    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .dashboard-title {
      font-size: 15px;
      color: var(--muted);
      font-weight: 500;
    }

    .new-instance-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .new-instance-btn:hover { background: #c49664; }

    /* New instance form */
    .new-instance-form {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .new-instance-form.visible { display: block; }

    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .form-group input[type="text"] {
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .form-group input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-group input[type="text"]::placeholder { color: var(--muted); }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .checkbox-row label {
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .form-actions button {
      padding: 6px 16px;
      font-size: 13px;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      border: none;
    }

    .btn-create {
      background: var(--accent);
      color: var(--bg);
      font-weight: 500;
    }

    .btn-create:hover { background: #c49664; }

    .btn-form-cancel {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border) !important;
    }

    .btn-form-cancel:hover { color: var(--text); border-color: var(--muted) !important; }

    /* Instance grid */
    .instance-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    .instance-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.15s;
      position: relative;
    }

    .instance-card:hover {
      border-color: var(--muted);
      background: #1c1c1c;
    }

    .instance-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .instance-name {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .instance-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .instance-status-dot.idle { background: var(--success); }
    .instance-status-dot.processing { background: var(--warning); animation: pulse 1.5s ease-in-out infinite; }
    .instance-status-dot.error { background: var(--error); }
    .instance-status-dot.stopped { background: var(--muted); }

    .instance-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .instance-badge.external {
      background: rgba(96, 165, 250, 0.15);
      color: #60a5fa;
    }

    .input-area.readonly {
      justify-content: center;
      padding: 10px 16px;
    }

    .readonly-notice {
      font-size: 13px;
      color: var(--muted);
    }

    .btn-resume {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      color: var(--bg);
      background: #60a5fa;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 12px;
      transition: background 0.2s;
    }

    .btn-resume:hover { background: #3b82f6; }

    .instance-delete-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, border-color 0.15s;
    }

    .instance-card:hover .instance-delete-btn { opacity: 1; }
    .instance-delete-btn:hover { color: var(--error); border-color: var(--error); }

    .instance-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .instance-meta span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state p {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .empty-state .hint {
      font-size: 12px;
      opacity: 0.7;
    }

    /* ===================== INSTANCE DETAIL VIEW ===================== */
    #instance-view {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    #instance-view.active {
      display: flex;
    }

    .instance-header-info {
      font-size: 12px;
      color: var(--muted);
      padding: 6px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 15px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
    }

    .message.claude {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      padding: 6px 12px;
      text-align: center;
    }

    .message.system.error { color: var(--error); }

    /* Thinking indicator */
    .thinking {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .thinking-dots {
      display: flex;
      gap: 4px;
    }

    .thinking-dots span {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
    .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .message, .activity-group, .thinking {
      animation: fadeIn 0.25s ease-out forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .message, .activity-group, .thinking {
        animation: fadeIn 0.15s ease-out forwards;
      }
    }

    .message.thinking-block {
      align-self: flex-start;
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-left: 3px solid var(--accent);
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
    }

    .thinking-block-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-bottom: 4px;
      font-style: normal;
    }

    /* Markdown content styling */
    .message.claude { white-space: normal; }
    .message.claude p { margin: 0 0 0.75em 0; }
    .message.claude p:last-child { margin-bottom: 0; }

    .message.claude h1,
    .message.claude h2,
    .message.claude h3,
    .message.claude h4 {
      margin: 1em 0 0.5em 0;
      font-weight: 600;
      line-height: 1.3;
    }

    .message.claude h1:first-child,
    .message.claude h2:first-child,
    .message.claude h3:first-child { margin-top: 0; }

    .message.claude h1 { font-size: 1.4em; }
    .message.claude h2 { font-size: 1.2em; }
    .message.claude h3 { font-size: 1.1em; }

    .message.claude ul,
    .message.claude ol { margin: 0.5em 0; padding-left: 1.5em; }
    .message.claude li { margin: 0.25em 0; }

    .message.claude code {
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 0.9em;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.15em 0.4em;
      border-radius: 4px;
    }

    .message.claude pre {
      margin: 0.75em 0;
      padding: 12px;
      background: #0d1117;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border);
    }

    .message.claude pre code {
      background: transparent;
      padding: 0;
      font-size: 0.85em;
      line-height: 1.5;
    }

    .message.claude blockquote {
      margin: 0.75em 0;
      padding: 0.5em 1em;
      border-left: 3px solid var(--accent);
      background: rgba(0, 0, 0, 0.2);
      border-radius: 0 4px 4px 0;
    }

    .message.claude blockquote p { margin: 0; }

    .message.claude hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1em 0;
    }

    .message.claude a { color: var(--accent); text-decoration: none; }
    .message.claude a:hover { text-decoration: underline; }
    .message.claude strong { font-weight: 600; color: var(--text); }

    .message.claude table {
      border-collapse: collapse;
      margin: 0.75em 0;
      width: 100%;
      font-size: 0.9em;
    }

    .message.claude th,
    .message.claude td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    .message.claude th {
      background: rgba(0, 0, 0, 0.3);
      font-weight: 600;
    }

    /* Activity group */
    .activity-group {
      align-self: flex-start;
      display: flex;
      flex-direction: column;
      gap: 1px;
      max-width: 90%;
    }

    .activity {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
    }

    .activity.collapsed { display: none; }
    .activity-group.expanded .activity.collapsed { display: flex; }

    .activity-group-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      padding: 2px 10px;
      cursor: pointer;
      opacity: 0.6;
      font-family: inherit;
    }

    .activity-group-toggle:hover { opacity: 1; color: var(--accent); }

    .activity-group-toggle .toggle-arrow {
      display: inline-block;
      transition: transform 0.15s ease;
      font-size: 10px;
    }

    .activity-group.expanded .toggle-arrow { transform: rotate(90deg); }

    .activity-icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      font-size: 9px;
    }

    .activity-icon.tool { background: #1e3a5f; color: #60a5fa; }
    .activity-icon.thinking { background: #3f3f46; color: var(--accent); }
    .activity-icon.result { background: #14532d; color: #4ade80; }

    .activity-content {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .activity-description {
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }

    .activity-detail {
      font-family: "SF Mono", Monaco, monospace;
      font-size: 11px;
      color: var(--muted);
      opacity: 0.7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Expandable activity rows */
    .activity.expandable {
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .activity.expandable:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .activity .expand-chevron {
      flex-shrink: 0;
      width: 12px;
      height: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: var(--muted);
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
      transform: rotate(0deg);
    }

    .activity.expandable:hover .expand-chevron {
      opacity: 0.6;
    }

    .activity.detail-expanded .expand-chevron {
      opacity: 0.6;
      transform: rotate(90deg);
    }

    .activity.detail-expanded .activity-detail {
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow: visible;
      text-overflow: unset;
      opacity: 0.85;
    }

    .activity.detail-expanded .activity-content {
      flex-wrap: wrap;
    }

    .activity.detail-expanded .activity-detail {
      flex-basis: 100%;
      padding: 3px 0 2px 0;
    }

    /* Error activity rows */
    .activity.activity-error {
      background: rgba(220, 38, 38, 0.08);
      border-radius: 4px;
    }

    .activity.activity-error .activity-description {
      color: var(--error);
    }

    .activity.activity-error .activity-icon.result {
      background: #3b1111;
      color: #f87171;
    }

    /* Code block copy button */
    .message.claude pre {
      position: relative;
    }

    .code-copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-family: inherit;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
      z-index: 1;
      line-height: 1.3;
    }

    .message.claude pre:hover .code-copy-btn {
      opacity: 0.7;
    }

    .code-copy-btn:hover {
      opacity: 1 !important;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .code-copy-btn.copied {
      opacity: 1 !important;
      color: var(--success);
      border-color: var(--success);
    }

    /* Input Area */
    .input-area {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .textarea-wrapper {
      flex: 1;
      position: relative;
      display: flex;
    }

    #message-input {
      width: 100%;
      min-height: 40px;
      max-height: 120px;
      padding: 10px 12px;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.4;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: none;
      overflow-y: auto;
      -webkit-appearance: none;
    }

    #message-input:focus { outline: none; border-color: var(--accent); }
    #message-input::placeholder { color: var(--muted); }

    .input-buttons { display: flex; gap: 8px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-send { background: var(--accent); color: var(--bg); }
    .btn-send:hover:not(:disabled) { background: #c49664; }

    .btn-cancel {
      background: var(--error);
      color: var(--text);
      display: none;
    }

    .btn-cancel.visible { display: flex; }
    .btn-cancel:hover:not(:disabled) { background: #b91c1c; }

    .icon { width: 20px; height: 20px; }

    /* Responsive */
    @media (max-width: 480px) {
      .header { padding: 10px 12px; }
      .title { font-size: 16px; }
      .status-text { display: none; }
      .messages { padding: 12px; }
      .message { max-width: 90%; font-size: 14px; }
      .input-area { padding: 10px 12px; }
      .instance-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="back-btn" id="back-btn" title="Back to Dashboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <span class="title" id="header-title">Claude Relay</span>
      <div class="status">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Disconnected</span>
      </div>
    </div>
    <div class="header-right">
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- ===================== DASHBOARD VIEW ===================== -->
  <div id="dashboard-view">
    <div class="dashboard-header">
      <span class="dashboard-title" id="dashboard-count">No instances</span>
      <button class="new-instance-btn" id="new-instance-btn">+ New Instance</button>
    </div>

    <div class="new-instance-form" id="new-instance-form">
      <div class="form-row">
        <div class="form-group">
          <label for="form-name">Name (optional)</label>
          <input type="text" id="form-name" placeholder="e.g. My Project">
        </div>
        <div class="form-group">
          <label for="form-cwd">Working Directory</label>
          <input type="text" id="form-cwd" placeholder="/path/to/project">
        </div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="form-skip-perms">
        <label for="form-skip-perms">Skip permission prompts (dangerously)</label>
      </div>
      <div class="form-actions">
        <button class="btn-form-cancel" id="form-cancel-btn">Cancel</button>
        <button class="btn-create" id="form-create-btn">Create</button>
      </div>
    </div>

    <div class="instance-grid" id="instance-grid"></div>
    <div class="empty-state" id="empty-state">
      <p>No instances running</p>
      <span class="hint">Create a new instance to start chatting with Claude</span>
    </div>
  </div>

  <!-- ===================== INSTANCE DETAIL VIEW ===================== -->
  <div id="instance-view">
    <div class="instance-header-info" id="instance-header-info"></div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="textarea-wrapper">
        <textarea
          id="message-input"
          placeholder="Send a message..."
          rows="1"
        ></textarea>
      </div>
      <div class="input-buttons">
        <button class="btn btn-cancel" id="cancel-btn" title="Cancel (Esc)">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <button class="btn btn-send" id="send-btn" title="Send (Enter)">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // DOM elements
    const messagesEl = document.getElementById("messages");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const headerTitle = document.getElementById("header-title");
    const backBtn = document.getElementById("back-btn");
    const dashboardView = document.getElementById("dashboard-view");
    const instanceView = document.getElementById("instance-view");
    const instanceGrid = document.getElementById("instance-grid");
    const emptyState = document.getElementById("empty-state");
    const dashboardCount = document.getElementById("dashboard-count");
    const newInstanceBtn = document.getElementById("new-instance-btn");
    const newInstanceForm = document.getElementById("new-instance-form");
    const formName = document.getElementById("form-name");
    const formCwd = document.getElementById("form-cwd");
    const formSkipPerms = document.getElementById("form-skip-perms");
    const formCreateBtn = document.getElementById("form-create-btn");
    const formCancelBtn = document.getElementById("form-cancel-btn");
    const instanceHeaderInfo = document.getElementById("instance-header-info");

    // State
    let ws = null;
    let isConnected = false;
    let isProcessing = false;
    let currentClaudeMessage = null;
    let currentClaudeText = "";
    let currentThinkingEl = null;
    let reconnectTimeout = null;
    let currentActivityGroup = null;

    // Instance state
    let instances = [];
    let currentInstanceId = null;

    // Activity group management
    const VISIBLE_ACTIVITY_COUNT = 3;

    function getOrCreateActivityGroup() {
      if (currentActivityGroup) return currentActivityGroup;
      const group = document.createElement("div");
      group.className = "activity-group";
      messagesEl.appendChild(group);
      currentActivityGroup = group;
      return group;
    }

    function closeActivityGroup() {
      currentActivityGroup = null;
    }

    function updateGroupCollapse(group) {
      const activities = Array.from(group.querySelectorAll(".activity"));
      let toggle = group.querySelector(".activity-group-toggle");
      const total = activities.length;
      const hiddenCount = total - VISIBLE_ACTIVITY_COUNT;

      if (hiddenCount <= 0) {
        if (toggle) toggle.remove();
        activities.forEach(a => a.classList.remove("collapsed"));
        return;
      }

      const isExpanded = group.classList.contains("expanded");
      activities.forEach((a, i) => {
        if (!isExpanded && i < hiddenCount) {
          a.classList.add("collapsed");
        } else {
          a.classList.remove("collapsed");
        }
      });

      if (!toggle) {
        toggle = document.createElement("button");
        toggle.className = "activity-group-toggle";
        toggle.addEventListener("click", () => {
          group.classList.toggle("expanded");
          updateGroupCollapse(group);
          scrollToBottom();
        });
        group.insertBefore(toggle, group.firstChild);
      }

      if (isExpanded) {
        toggle.innerHTML = '<span class="toggle-arrow">&#9654;</span> Show less';
      } else {
        toggle.innerHTML = '<span class="toggle-arrow">&#9654;</span> ' + hiddenCount + ' more';
      }
    }

    // ===================== CLIENT-SIDE ROUTING =====================

    function getRouteFromPath() {
      const path = window.location.pathname;
      const match = path.match(/^\/chat\/([a-f0-9-]+)$/);
      if (match) return { view: "instance", id: match[1] };
      return { view: "dashboard" };
    }

    function navigateTo(path, replace = false) {
      if (replace) {
        history.replaceState(null, "", path);
      } else {
        history.pushState(null, "", path);
      }
      applyRoute();
    }

    function applyRoute() {
      const route = getRouteFromPath();
      if (route.view === "instance") {
        showInstanceView(route.id);
      } else {
        showDashboardView();
      }
    }

    window.addEventListener("popstate", applyRoute);

    function showDashboardView() {
      // Unsubscribe from current instance
      if (currentInstanceId && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "unsubscribe", instanceId: currentInstanceId }));
      }

      currentInstanceId = null;
      dashboardView.style.display = "";
      instanceView.classList.remove("active");
      backBtn.classList.remove("visible");
      headerTitle.textContent = "Claude Relay";

      // Reset chat state
      resetChatState();
      renderInstanceGrid();
    }

    function showInstanceView(id) {
      const instance = instances.find(i => i.id === id);
      if (!instance && isConnected) {
        // Instance not found, go to dashboard
        navigateTo("/chat", true);
        return;
      }

      // Unsubscribe from previous instance
      if (currentInstanceId && currentInstanceId !== id && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "unsubscribe", instanceId: currentInstanceId }));
      }

      currentInstanceId = id;
      dashboardView.style.display = "none";
      instanceView.classList.add("active");
      backBtn.classList.add("visible");

      if (instance) {
        headerTitle.textContent = instance.name + (instance.external ? ' (External)' : '');
        instanceHeaderInfo.textContent = instance.workingDirectory;
        updateInstanceStatus(instance);
      }

      // Toggle input area based on external status
      const inputArea = document.querySelector('.input-area');
      const isExternal = instance && instance.external;
      if (isExternal) {
        inputArea.classList.add('readonly');
        inputArea.innerHTML = '<span class="readonly-notice">Monitoring external session (read-only)</span>' +
          '<button class="btn-resume" id="resume-btn">Resume</button>';
        document.getElementById("resume-btn").addEventListener("click", () => {
          if (ws && ws.readyState === WebSocket.OPEN && currentInstanceId) {
            ws.send(JSON.stringify({ type: "resume_instance", instanceId: currentInstanceId }));
          }
        });
      } else {
        inputArea.classList.remove('readonly');
        inputArea.innerHTML =
          '<div class="textarea-wrapper">' +
            '<textarea id="message-input" placeholder="Send a message..." rows="1"></textarea>' +
          '</div>' +
          '<div class="input-buttons">' +
            '<button class="btn btn-cancel" id="cancel-btn" title="Cancel (Esc)">' +
              '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<line x1="18" y1="6" x2="6" y2="18"></line>' +
                '<line x1="6" y1="6" x2="18" y2="18"></line>' +
              '</svg>' +
            '</button>' +
            '<button class="btn btn-send" id="send-btn" title="Send (Enter)">' +
              '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<line x1="22" y1="2" x2="11" y2="13"></line>' +
                '<polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>' +
              '</svg>' +
            '</button>' +
          '</div>';
        rebindInputElements();
      }

      resetChatState();
      messagesEl.innerHTML = "";

      // Subscribe to instance
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "subscribe", instanceId: id }));
      }

      if (!isExternal) {
        const input = document.getElementById("message-input");
        if (input) input.focus();
      }
    }

    function resetChatState() {
      currentClaudeMessage = null;
      currentClaudeText = "";
      currentThinkingEl = null;
      currentActivityGroup = null;
      isProcessing = false;
      const cancel = document.getElementById("cancel-btn");
      if (cancel) cancel.classList.remove("visible");
    }

    function updateInstanceStatus(instance) {
      if (!instance) return;
      if (currentInstanceId === instance.id) {
        // If instance transitioned from external to managed, rebuild input area
        const inputArea = document.querySelector('.input-area');
        if (!instance.external && inputArea && inputArea.classList.contains('readonly')) {
          headerTitle.textContent = instance.name;
          inputArea.classList.remove('readonly');
          inputArea.innerHTML =
            '<div class="textarea-wrapper">' +
              '<textarea id="message-input" placeholder="Send a message..." rows="1"></textarea>' +
            '</div>' +
            '<div class="input-buttons">' +
              '<button class="btn btn-cancel" id="cancel-btn" title="Cancel (Esc)">' +
                '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<line x1="18" y1="6" x2="6" y2="18"></line>' +
                  '<line x1="6" y1="6" x2="18" y2="18"></line>' +
                '</svg>' +
              '</button>' +
              '<button class="btn btn-send" id="send-btn" title="Send (Enter)">' +
                '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<line x1="22" y1="2" x2="11" y2="13"></line>' +
                  '<polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>' +
                '</svg>' +
              '</button>' +
            '</div>';
          rebindInputElements();
          const input = document.getElementById("message-input");
          if (input) input.focus();
        }

        const cancel = document.getElementById("cancel-btn");
        if (instance.status === "processing") {
          statusDot.className = "status-dot connected processing";
          statusText.textContent = instance.external ? "Active" : "Processing";
          isProcessing = true;
          if (cancel && !instance.external) cancel.classList.add("visible");
        } else {
          statusDot.className = "status-dot connected";
          statusText.textContent = instance.external ? "Monitoring" : "Connected";
          isProcessing = false;
          if (cancel) cancel.classList.remove("visible");
        }
      }
    }

    // ===================== DASHBOARD RENDERING =====================

    function renderInstanceGrid() {
      instanceGrid.innerHTML = "";

      if (instances.length === 0) {
        emptyState.style.display = "";
        dashboardCount.textContent = "No instances";
      } else {
        emptyState.style.display = "none";
        dashboardCount.textContent = instances.length + " instance" + (instances.length !== 1 ? "s" : "");

        for (const inst of instances) {
          const card = document.createElement("div");
          card.className = "instance-card";
          card.addEventListener("click", (e) => {
            if (e.target.closest(".instance-delete-btn")) return;
            navigateTo("/chat/" + inst.id);
          });

          const timeAgo = formatTimeAgo(inst.lastActivityAt);
          const badge = inst.external
            ? '<span class="instance-badge external">External</span>'
            : '';
          const deleteBtn = inst.external
            ? ''
            : '<button class="instance-delete-btn" title="Delete instance">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<line x1="18" y1="6" x2="6" y2="18"></line>' +
                  '<line x1="6" y1="6" x2="18" y2="18"></line>' +
                '</svg>' +
              '</button>';

          card.innerHTML =
            '<div class="instance-card-header">' +
              '<div class="instance-name">' +
                '<span class="instance-status-dot ' + inst.status + '"></span>' +
                escapeHtml(inst.name) + badge +
              '</div>' +
              deleteBtn +
            '</div>' +
            '<div class="instance-meta">' +
              '<span>' + escapeHtml(inst.workingDirectory) + '</span>' +
              '<span>Last active: ' + timeAgo + '</span>' +
            '</div>';

          if (!inst.external) {
            card.querySelector(".instance-delete-btn").addEventListener("click", (e) => {
              e.stopPropagation();
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "remove_instance", instanceId: inst.id }));
              }
            });
          }

          instanceGrid.appendChild(card);
        }
      }
    }

    function formatTimeAgo(timestamp) {
      const diff = Date.now() - timestamp;
      if (diff < 60000) return "just now";
      if (diff < 3600000) return Math.floor(diff / 60000) + "m ago";
      if (diff < 86400000) return Math.floor(diff / 3600000) + "h ago";
      return Math.floor(diff / 86400000) + "d ago";
    }

    // ===================== NEW INSTANCE FORM =====================

    newInstanceBtn.addEventListener("click", () => {
      newInstanceForm.classList.toggle("visible");
      if (newInstanceForm.classList.contains("visible")) {
        formName.focus();
      }
    });

    formCancelBtn.addEventListener("click", () => {
      newInstanceForm.classList.remove("visible");
      formName.value = "";
      formCwd.value = "";
      formSkipPerms.checked = false;
    });

    formCreateBtn.addEventListener("click", () => {
      const payload = { type: "create_instance" };
      if (formName.value.trim()) payload.name = formName.value.trim();
      if (formCwd.value.trim()) payload.workingDirectory = formCwd.value.trim();
      if (formSkipPerms.checked) payload.dangerouslySkipPermissions = true;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
      }

      newInstanceForm.classList.remove("visible");
      formName.value = "";
      formCwd.value = "";
      formSkipPerms.checked = false;
    });

    // ===================== WEBSOCKET CONNECTION =====================

    function connect() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = protocol + "//" + window.location.host;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {};

      ws.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          handleMessage(message);
        } catch (e) {
          console.error("Failed to parse message:", e);
        }
      };

      ws.onclose = () => {
        setDisconnected();
        scheduleReconnect();
      };

      ws.onerror = (error) => {
        console.error("WebSocket error:", error);
      };
    }

    function scheduleReconnect() {
      if (reconnectTimeout) clearTimeout(reconnectTimeout);
      reconnectTimeout = setTimeout(() => { connect(); }, 3000);
    }

    function setConnected() {
      isConnected = true;
      statusDot.className = "status-dot connected";
      statusText.textContent = "Connected";
      const input = document.getElementById("message-input");
      const send = document.getElementById("send-btn");
      if (input) input.disabled = false;
      if (send) send.disabled = false;
    }

    function setDisconnected() {
      isConnected = false;
      isProcessing = false;
      statusDot.className = "status-dot";
      statusText.textContent = "Disconnected";
      const input = document.getElementById("message-input");
      const send = document.getElementById("send-btn");
      const cancel = document.getElementById("cancel-btn");
      if (input) input.disabled = true;
      if (send) send.disabled = true;
      if (cancel) cancel.classList.remove("visible");
      resetChatState();
    }

    function setProcessing(processing) {
      isProcessing = processing;
      const cancel = document.getElementById("cancel-btn");
      const currentInstance = instances.find(i => i.id === currentInstanceId);
      const isExternal = currentInstance && currentInstance.external;
      if (processing) {
        statusDot.className = "status-dot connected processing";
        statusText.textContent = isExternal ? "Active" : "Processing";
        if (cancel && !isExternal) cancel.classList.add("visible");
      } else {
        statusDot.className = "status-dot connected";
        statusText.textContent = isExternal ? "Monitoring" : "Connected";
        if (cancel) cancel.classList.remove("visible");
      }
    }

    // ===================== MESSAGE HANDLING =====================

    function handleMessage(message) {
      switch (message.type) {
        case "connected":
          setConnected();
          break;

        case "instance_list":
          instances = message.instances;
          renderInstanceGrid();
          // If we're supposed to be viewing an instance, apply route now
          applyRoute();
          break;

        case "instance_created":
          instances.push(message.instance);
          renderInstanceGrid();
          break;

        case "instance_removed":
          instances = instances.filter(i => i.id !== message.instanceId);
          renderInstanceGrid();
          if (currentInstanceId === message.instanceId) {
            navigateTo("/chat", true);
          }
          break;

        case "instance_status": {
          const idx = instances.findIndex(i => i.id === message.instanceId);
          if (idx >= 0) {
            instances[idx] = message.instance;
          }
          renderInstanceGrid();
          updateInstanceStatus(message.instance);
          break;
        }

        case "instance_history":
          if (message.instanceId === currentInstanceId) {
            renderHistory(message.history);
          }
          break;

        case "output":
          if (message.instanceId === currentInstanceId) {
            handleOutput(message);
          }
          break;

        case "activity":
          if (message.instanceId === currentInstanceId) {
            handleActivity(message);
          }
          break;

        case "user":
          if (message.instanceId === currentInstanceId) {
            addUserMessage(message.text);
          }
          break;

        case "exit":
          if (message.instanceId === currentInstanceId) {
            closeActivityGroup();
            setProcessing(false);
            currentClaudeMessage = null;
            currentClaudeText = "";
            if (message.code !== 0) {
              addSystemMessage("Claude process exited with code " + message.code, true);
            }
          }
          break;

        case "error":
          if (!message.instanceId || message.instanceId === currentInstanceId) {
            closeActivityGroup();
            addSystemMessage("Error: " + message.message, true);
            setProcessing(false);
            currentClaudeMessage = null;
            currentClaudeText = "";
          }
          break;

        default:
          console.warn("Unknown message type:", message.type);
      }
    }

    function renderHistory(history) {
      messagesEl.innerHTML = "";
      resetChatState();

      for (const entry of history) {
        const msg = entry.message;
        switch (msg.type) {
          case "output":
            if (msg.thinking) {
              addThinkingBlock(msg.thinking);
            } else if (msg.text && msg.text.trim()) {
              closeActivityGroup();
              if (!currentClaudeMessage) {
                currentClaudeText = msg.text;
                currentClaudeMessage = addClaudeMessage(currentClaudeText);
              } else {
                currentClaudeText += msg.text;
                updateClaudeMessage(currentClaudeMessage, currentClaudeText);
              }
            }
            if (msg.isWaiting) {
              hideThinking();
              closeActivityGroup();
              currentClaudeMessage = null;
              currentClaudeText = "";
            }
            break;

          case "user":
            closeActivityGroup();
            currentClaudeMessage = null;
            currentClaudeText = "";
            addUserMessage(msg.text);
            break;

          case "activity":
            renderActivityEntry(msg);
            break;

          case "exit":
            closeActivityGroup();
            currentClaudeMessage = null;
            currentClaudeText = "";
            if (msg.code !== 0) {
              addSystemMessage("Claude process exited with code " + msg.code, true);
            }
            break;
        }
      }

      scrollToBottom();
    }

    function getCollapsedDetail(detail, tool) {
      if (!detail) return "";
      // For file paths (Read, Edit, Write, Glob, Grep): show just filename
      if (tool === "Read" || tool === "Edit" || tool === "Write") {
        const parts = detail.split("/");
        if (parts.length > 1) {
          return parts[parts.length - 1];
        }
      }
      // For bash commands: show first ~80 chars
      if (tool === "Bash") {
        if (detail.length > 80) {
          return detail.slice(0, 80) + "\u2026";
        }
      }
      // Default: truncate with ellipsis if long
      if (detail.length > 100) {
        return detail.slice(0, 100) + "\u2026";
      }
      return detail;
    }

    function renderActivityEntry(message) {
      const iconMap = {
        tool_use: { icon: "&#9889;", cls: "tool" },
        tool_result: { icon: "&#10003;", cls: "result" },
        thinking: { icon: "&#128173;", cls: "thinking" },
      };

      const info = iconMap[message.activity] || { icon: "&#8226;", cls: "tool" };
      const isError = message.description === "Tool error";
      const hasDetail = !!message.detail;
      const collapsedText = hasDetail ? getCollapsedDetail(message.detail, message.tool) : "";
      const fullText = message.detail || "";
      const isExpandable = hasDetail && collapsedText !== fullText;

      const el = document.createElement("div");
      el.className = "activity" + (isError ? " activity-error" : "") + (isExpandable ? " expandable" : "");

      const toolLabel = message.tool ? '<span style="opacity:0.5;font-weight:400">' + escapeHtml(message.tool) + '</span>' : "";
      const desc = escapeHtml(message.description);
      const chevron = isExpandable ? '<span class="expand-chevron">&#9654;</span>' : "";
      const detail = hasDetail ? '<div class="activity-detail">' + escapeHtml(collapsedText) + '</div>' : "";

      el.innerHTML =
        '<div class="activity-icon ' + info.cls + '">' + info.icon + '</div>' +
        '<div class="activity-content">' +
          '<span class="activity-description">' + desc + '</span>' + toolLabel + detail +
        '</div>' + chevron;

      // Store full detail for expand/collapse
      if (isExpandable) {
        el._fullDetail = fullText;
        el._collapsedDetail = collapsedText;
        el.addEventListener("click", function() {
          const detailEl = el.querySelector(".activity-detail");
          if (!detailEl) return;
          const expanded = el.classList.toggle("detail-expanded");
          detailEl.textContent = expanded ? el._fullDetail : el._collapsedDetail;
          scrollToBottom();
        });
      } else if (hasDetail && !isExpandable) {
        // Detail fits fully — still allow click to show it's not truncated (no-op but keep cursor default)
      }

      const group = getOrCreateActivityGroup();
      group.appendChild(el);
      updateGroupCollapse(group);
    }

    function handleActivity(message) {
      setProcessing(true);
      hideThinking();
      renderActivityEntry(message);
      scrollToBottom();
    }

    function handleOutput(message) {
      setProcessing(true);

      if (message.thinking) {
        addThinkingBlock(message.thinking);
        return;
      }

      if (message.text && message.text.trim()) {
        hideThinking();
        closeActivityGroup();
      }

      if (!currentClaudeMessage && message.text) {
        currentClaudeText = message.text;
        currentClaudeMessage = addClaudeMessage(currentClaudeText);
      } else if (currentClaudeMessage && message.text) {
        currentClaudeText += message.text;
        updateClaudeMessage(currentClaudeMessage, currentClaudeText);
      }

      scrollToBottom();

      if (message.isWaiting) {
        hideThinking();
        closeActivityGroup();
        setProcessing(false);
        currentClaudeMessage = null;
        currentClaudeText = "";
      }
    }

    // Message creation
    function addUserMessage(text) {
      const el = document.createElement("div");
      el.className = "message user";
      el.textContent = text;
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function addCopyButtons(el) {
      const preBlocks = el.querySelectorAll("pre");
      preBlocks.forEach(function(pre) {
        // Skip if already has a copy button
        if (pre.querySelector(".code-copy-btn")) return;
        const btn = document.createElement("button");
        btn.className = "code-copy-btn";
        btn.textContent = "Copy";
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          const code = pre.querySelector("code");
          const text = code ? code.textContent : pre.textContent;
          navigator.clipboard.writeText(text).then(function() {
            btn.textContent = "Copied!";
            btn.classList.add("copied");
            setTimeout(function() {
              btn.textContent = "Copy";
              btn.classList.remove("copied");
            }, 1500);
          }).catch(function() {
            // Fallback for older browsers
            btn.textContent = "Failed";
            setTimeout(function() { btn.textContent = "Copy"; }, 1500);
          });
        });
        pre.appendChild(btn);
      });
    }

    function addClaudeMessage(text) {
      const el = document.createElement("div");
      el.className = "message claude";
      el.innerHTML = marked.parse(text);
      addCopyButtons(el);
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function updateClaudeMessage(el, text) {
      el.innerHTML = marked.parse(text);
      addCopyButtons(el);
      scrollToBottom();
    }

    function addSystemMessage(text, isError) {
      const el = document.createElement("div");
      el.className = "message system" + (isError ? " error" : "");
      el.textContent = text;
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showThinking() {
      if (currentThinkingEl) return;
      currentThinkingEl = document.createElement("div");
      currentThinkingEl.className = "thinking";
      currentThinkingEl.innerHTML =
        '<div class="thinking-dots"><span></span><span></span><span></span></div>' +
        '<span>Claude is thinking...</span>';
      messagesEl.appendChild(currentThinkingEl);
      scrollToBottom();
    }

    function hideThinking() {
      if (currentThinkingEl) {
        currentThinkingEl.remove();
        currentThinkingEl = null;
      }
    }

    function addThinkingBlock(text) {
      const el = document.createElement("div");
      el.className = "message thinking-block";
      el.innerHTML = '<div class="thinking-block-label">Thinking</div>' + escapeHtml(text);
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Rebind input elements after dynamic recreation
    function rebindInputElements() {
      const newInput = document.getElementById("message-input");
      const newSendBtn = document.getElementById("send-btn");
      const newCancelBtn = document.getElementById("cancel-btn");

      if (newInput) {
        newInput.addEventListener("input", adjustTextareaHeight);
        newInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
          if (e.key === "Escape") {
            cancelOperation();
          }
        });
      }

      if (newSendBtn) {
        newSendBtn.addEventListener("click", sendMessage);
      }

      if (newCancelBtn) {
        newCancelBtn.addEventListener("click", cancelOperation);
      }
    }

    // Sending messages
    function sendMessage() {
      const input = document.getElementById("message-input");
      if (!input) return;
      const text = input.value.trim();
      if (!text || !isConnected || !currentInstanceId) return;

      closeActivityGroup();
      ws.send(JSON.stringify({
        type: "instance_message",
        instanceId: currentInstanceId,
        text: text,
      }));
      input.value = "";
      adjustTextareaHeight();
      setProcessing(true);
      showThinking();
    }

    function cancelOperation() {
      if (!isConnected || !isProcessing || !currentInstanceId) return;
      ws.send(JSON.stringify({
        type: "instance_cancel",
        instanceId: currentInstanceId,
      }));
    }

    // Textarea auto-grow
    function adjustTextareaHeight() {
      const input = document.getElementById("message-input");
      if (!input) return;
      input.style.height = "auto";
      const newHeight = Math.min(input.scrollHeight, 120);
      input.style.height = newHeight + "px";
    }

    // Event listeners — input elements are dynamically bound via rebindInputElements()

    backBtn.addEventListener("click", () => {
      navigateTo("/chat");
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        cancelOperation();
      }
    });

    function logout() {
      window.location.href = "/logout";
    }

    // Configure marked for markdown rendering
    marked.setOptions({
      breaks: true,
      gfm: true,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try {
            return hljs.highlight(code, { language: lang }).value;
          } catch (e) {}
        }
        return code;
      }
    });

    // Initialize
    connect();
    applyRoute();
  </script>
</body>
</html>
